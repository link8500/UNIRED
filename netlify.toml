# GitHub Actions compila Flutter y publica la carpeta terminada.
# Detén los builds de Netlify si conectas también el repositorio desde su panel.
[build]
  publish = "build/web"

# Conserva el acceso a la aplicación al abrir una ruta directamente.
# Los archivos existentes, como imágenes y scripts, conservan su ruta.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
