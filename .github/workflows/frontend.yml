name: Verificar y publicar frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Esta dirección es pública y se incorpora al compilar Flutter Web.
      API_BASE_URL: https://unired-backend-mpl6.onrender.com/api/v1
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: Instalar las dependencias del proyecto
        run: flutter pub get --enforce-lockfile

      - name: Analizar el código
        run: flutter analyze --no-pub

      - name: Ejecutar las pruebas
        run: flutter test --no-pub

      - name: Compilar la página con la API de Render
        run: flutter build web --release --no-pub --dart-define=API_BASE_URL="$API_BASE_URL"

      # Las solicitudes de cambios solo verifican el proyecto.
      # La publicación ocurre después de las comprobaciones y solo desde main.
      - name: Preparar Node para publicar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Publicar en Netlify
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo '::error::Configura NETLIFY_AUTH_TOKEN y NETLIFY_SITE_ID en Settings > Secrets and variables > Actions del repositorio UNIRED.'
            exit 1
          fi
          npx --yes netlify-cli@27.19.0 deploy --prod --no-build --dir=build/web
